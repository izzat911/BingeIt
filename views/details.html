<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingeIt - Movie Details</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/details.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="../public/images/camera-svgrepo-com.svg.png" alt="BingeIt Logo">
                <h2>Binge<span>It</span></h2>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="ai.html">AI Matcher</a></li>
                <li><a href="login.html" class="login-btn" id="login-nav-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <div id="details-loading" class="details-loading">
        <div class="spinner"></div>
    </div>

    <div id="details-error" class="details-error" hidden></div>

    <section id="details-content" class="details-content" hidden>

        <div class="details-hero">
            <img id="details-poster" src="" alt="Movie Poster">

            <div class="details-info">
                <h1 id="details-title"></h1>
                <p id="details-tagline" class="details-tagline"></p>

                <div class="details-meta">
                    <span id="details-rating"></span>
                    <span id="details-year"></span>
                    <span id="details-runtime"></span>
                </div>

                <div id="details-genres" class="details-genres"></div>

                <p id="details-overview" class="details-overview"></p>
            </div>
        </div>

        <div class="details-cast-section">
            <h2>Top Cast</h2>
            <div id="details-cast" class="details-cast"></div>
        </div>

    </section>

    <script src="../public/js/details.js"></script>
    <script src="../public/js/nav-auth.js"></script>
</body>
</html>
