<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingeIt - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../public/css/auth.css">
</head>
<body>

    <div class="auth-page">

        <!-- Logo -->
        <a href="index.html" class="auth-logo">
            <img src="../public/images/camera-svgrepo-com.svg.png" alt="BingeIt Logo">
            <span class="brand-text">Binge<span>It</span></span>
        </a>

        <!-- Login Card -->
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Your next cinematic obsession awaits.</p>

            <form>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="auth-button">
                    Sign In
                </button>
            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>
        </div>

        <p class="auth-footer">
            Lights Off. Popcorn Ready. Binge On.
        </p>

    </div>

    <script src="../public/js/auth.js"></script>
</body>
</html>
